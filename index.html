<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f7fc">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="page-header">
      <p class="eyebrow">A LITTLE MORE FOCUS</p>
      <h1>My To-Do List</h1>
      <p class="intro">Keep track of what matters, one task at a time.</p>
    </header>

    <section class="todo-card" aria-labelledby="list-heading">
      <form class="add-form" id="add-form">
        <label class="sr-only" for="task-input">Add a task</label>
        <input
          id="task-input"
          name="task"
          type="text"
          placeholder="What needs to get done?"
          maxlength="100"
          autocomplete="off"
          required
        >
        <button class="button button-primary" type="submit">Add task</button>
      </form>

      <p class="storage-message" id="storage-message" role="status" hidden></p>

      <div class="list-heading">
        <div>
          <h2 id="list-heading">Your tasks</h2>
          <p class="task-count" id="task-count">0 tasks left</p>
        </div>
        <button class="text-button" id="clear-completed" type="button" hidden>
          Clear completed
        </button>
      </div>

      <nav class="filters" aria-label="Filter tasks">
        <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
        <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </nav>

      <ul class="task-list" id="task-list" aria-live="polite"></ul>
    </section>

    <footer class="page-footer">
      <span class="save-dot" aria-hidden="true"></span>
      Your tasks stay saved on this device
    </footer>
  </main>
</body>
</html>
